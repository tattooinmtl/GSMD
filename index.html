<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Monitor - NASA Satellite Data Visualization</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #dce3ea;
        color: #12181f;
      }
      html.dark,
      html.dark body {
        background-color: #07090c;
        color: #f2f5f8;
      }
    </style>
    <script>
      (function () {
        const isIniFrame = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        }
        var saved = null;
        try { saved = localStorage.getItem("earth_theme"); } catch (e) {}
        if (isIniFrame) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
          applyThemeToDOM(saved === "light" || saved === "dark" ? saved : "dark");
        } else {
          applyThemeToDOM(saved === "light" || saved === "dark" ? saved : "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
